<title>Go Travel Monthly Marketing Toolkit</title>
<meta property="og:title" content="Go Travel Monthly Marketing Toolkit">
<script>
// Opens the current month's calendar. Add a new line here each month.
(function(){
  var months=[
    ["2026-01-01","december-2026.html"]
  ];
  var now=new Date(), page=months[months.length-1][1];
  for(var i=0;i<months.length;i++){
    var p=months[i][0].split("-");
    if(now>=new Date(+p[0],+p[1]-1,+p[2])){page=months[i][1];break;}
  }
  location.replace(page+location.search);
})();
</script>
